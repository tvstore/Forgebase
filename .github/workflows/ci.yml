name: CI

# Triggers (cost control, see docs/blueprint/maintenance-policy.md, "CI"): pull requests that are not
# drafts, a weekly run and a manual run. There is no run on push to main: the PR was green on its
# head before it was merged (AGENTS.md section 10.3). The weekly run and `workflow_dispatch` on main
# also warm the Cargo cache that every pull request can read (a cache saved on a PR ref is visible
# to that PR only; one saved on the default branch is visible to all).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless across runs and would only make the cache bigger. Caches count
  # against GitHub's 10 GB per-repository limit; the least recently used are evicted when it is full.
  CARGO_INCREMENTAL: 0

jobs:
  # Which parts of the repository changed (C-4). Draft pull requests run nothing: the first job is
  # skipped and every job that needs it is skipped with it. A skipped job counts as a success for a
  # required status check. (Whether to require checks by job name, with branch protection, is the
  # owner's choice; none is required today.) The classification
  # is .github/ci/classify-paths.py, unit-tested below. `schedule` and `workflow_dispatch` do not
  # diff: everything runs.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      desk: ${{ steps.classify.outputs.desk }}
      e2e: ${{ steps.classify.outputs.e2e }}
      docker: ${{ steps.classify.outputs.docker }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      all: ${{ steps.classify.outputs.all }}
    steps:
      # Full history, so that the merge base of the pull request exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the classifier
        run: python3 .github/ci/test_classify_paths.py
      # `base...head` diffs against the merge base, so commits that main gained later are not
      # counted. --no-renames lists both the old and the new path of a rename.
      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/changed.txt"
          if [ "$EVENT" = pull_request ]; then
            git -c core.quotepath=false diff --name-only --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/changed.txt"
            cat "$RUNNER_TEMP/changed.txt"
          fi
          python3 .github/ci/classify-paths.py --event "$EVENT" < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/outputs.txt"
          # Fail closed: an empty or malformed result must fail the job, not skip every check.
          cat "$RUNNER_TEMP/outputs.txt"
          [ "$(cut -d= -f1 "$RUNNER_TEMP/outputs.txt" | paste -sd,)" = "rust,desk,e2e,docker,docs_only,all" ]
          [ "$(grep -cE '^[a-z0-9_]+=(true|false)$' "$RUNNER_TEMP/outputs.txt")" = 6 ]
          cat "$RUNNER_TEMP/outputs.txt" >> "$GITHUB_OUTPUT"

  # Offline check of the relative links and anchors in the Markdown files (about 10 seconds).
  docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/ci/linkcheck.py
  # The container image (D1, D2): builds the Dockerfile without pushing it anywhere and runs it once
  # in single-container mode against a PostgreSQL service. Runs only when the Dockerfile,
  # .dockerignore, deploy/ or .github/ change, and on the weekly and manual runs (which also catch a
  # change in the crates or the desk that breaks the build). Docker is preinstalled on the runner.
  docker:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the entrypoint (fake binary)
        run: bash deploy/test-entrypoint.sh
      - name: Build the image (no push)
        run: docker build -t forgebase-sales .
      # `all` mode on the host network (to reach the service on localhost): migrate on start, the
      # desk and the login page, a login and an authenticated API call, then a graceful stop (the exit
      # code must be 0, which needs both the server and the worker to stop on SIGTERM).
      - name: Smoke test, single-container mode
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name fb --network host \
            -e FORGEBASE_DATABASE_URL=postgres://forgebase:forgebase@localhost:5432/postgres \
            -e FORGEBASE_MIGRATE_ON_START=1 \
            -e FORGEBASE_ALLOWED_HOSTS=localhost \
            -e FORGEBASE_DEV_INSECURE_COOKIES=1 \
            forgebase-sales all
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8000/desk/ && break
            sleep 1
          done
          printf '%s\n' 'ci-smoke-password' | docker exec -i fb forgebase-app user create admin --role Administrator
          curl -fsS http://localhost:8000/desk/ | grep -q '<title>Forgebase Desk'
          curl -fsS -c "$RUNNER_TEMP/jar" -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-smoke-password"}' http://localhost:8000/api/v1/login > /dev/null
          curl -fsS -b "$RUNNER_TEMP/jar" http://localhost:8000/api/v1/meta > /dev/null
          docker logs fb 2>&1 | grep -q '^worker: started'
          docker stop fb
          test "$(docker inspect fb --format '{{.State.ExitCode}}')" = 0
      - name: Container logs
        if: failure()
        run: docker logs fb || true

  check:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true'
    # Pinned to 24.04, not ubuntu-latest: the client tools must match the postgres:16 service, and
    # 24.04 ships postgresql-client-16 in its own archive (26.04 does not). Re-evaluate when the
    # PostgreSQL floor or the service version changes, or when 24.04 runners are retired.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The forgebase-db, forgebase-http and forgebase integration tests need PostgreSQL (they create and drop fb_test_* databases).
    # --all-features turns on the `testing` feature of the forgebase crate (its helpers are tested too).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORGEBASE_TEST_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cargo registry and git downloads plus target/ (not the whole of ~/.cargo). The key follows the
      # toolchain and the lockfile; restore-keys gives a partial hit after a change of either.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-check-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-check-
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      # The backup tests run the real pg_dump and pg_restore, whose major version must equal the
      # server's (16): a newer pg_dump writes an archive that the server's pg_restore may not read,
      # and a newer pg_restore sends SQL that an older server rejects (newer runner images
      # ship 18). postgresql-client-16 installs to /usr/lib/postgresql/16/bin next to other
      # versions (the Ubuntu 24.04 archive has it; a no-op when it is installed already).
      # FORGEBASE_PG_BIN points there for the rest of the job. The step prints the versions and
      # fails if either is not 16.
      - name: PostgreSQL 16 client tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          bin=/usr/lib/postgresql/16/bin
          for tool in pg_dump pg_restore; do
            version="$("$bin/$tool" --version)"
            echo "$version"
            case "$version" in
              "$tool (PostgreSQL) 16."*) ;;
              *) echo "$tool is not version 16" >&2; exit 1 ;;
            esac
          done
          echo "FORGEBASE_PG_BIN=$bin" >> "$GITHUB_ENV"
      # TLS to PostgreSQL (M9.0, ADR 0018): a second PostgreSQL 16 on port 5433 with ssl=on and a
      # throwaway CA, started by the same script that runs locally. It appends
      # FORGEBASE_TEST_TLS_URL, FORGEBASE_TEST_TLS_CA and FORGEBASE_TEST_TLS_WRONG_CA to
      # GITHUB_ENV, so the TLS tests run in the `cargo test` below. They fail (never skip) when CI
      # is true and these variables are missing. Docker and openssl are on the runner.
      - name: PostgreSQL 16 with TLS
        run: .github/ci/pg-tls.sh up "$RUNNER_TEMP/pg-tls"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Two sites on one server and a backup restored into a new database (M7.3, ADR 0014): the
  # composed binary of examples/sales_extension with examples/sites/forgebase.toml. The script
  # examples/sites/ci.sh does the work and can be run locally. It needs the client tools
  # (pg_dump, pg_restore, version 16, the server's) like the `check` job. The URLs are built from the
  # service container's throwaway credentials; the script never prints them. The databases are
  # created by the script (`site create`).
  sites:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true'
    # Pinned to 24.04, not ubuntu-latest: the client tools must match the postgres:16 service, and
    # 24.04 ships postgresql-client-16 in its own archive (26.04 does not). Re-evaluate when the
    # PostgreSQL floor or the service version changes, or when 24.04 runners are retired.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHOP_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/sites_shop
      FIELD_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/sites_field
      RESTORE_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/sites_restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cargo registry and git downloads plus target/ (not the whole of ~/.cargo). The key follows the
      # toolchain and the lockfile; restore-keys gives a partial hit after a change of either.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-sites-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sites-
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Same step as in the `check` job (see the comment there).
      - name: PostgreSQL 16 client tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          bin=/usr/lib/postgresql/16/bin
          for tool in pg_dump pg_restore; do
            version="$("$bin/$tool" --version)"
            echo "$version"
            case "$version" in
              "$tool (PostgreSQL) 16."*) ;;
              *) echo "$tool is not version 16" >&2; exit 1 ;;
            esac
          done
          echo "FORGEBASE_PG_BIN=$bin" >> "$GITHUB_ENV"
      - run: cargo build --locked -p sales_extension
      - name: Two sites, a backup and a restore
        run: examples/sites/ci.sh

  # The MSRV check and cargo-deny share one job (one checkout, one cache). The cargo-deny binary is
  # cached by itself (version and toolchain in the key), so `cargo install` runs only on a miss.
  msrv-deny:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cargo registry and git downloads plus target/ (not the whole of ~/.cargo). The key follows the
      # toolchain and the lockfile; restore-keys gives a partial hit after a change of either.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-msrv-deny-msrv1.97-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-deny-msrv1.97-
      - run: rustup toolchain install 1.97 --profile minimal
      - run: cargo +1.97 check --workspace --all-targets --all-features --locked
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Cache cargo-deny
        id: cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.20.2-${{ hashFiles('rust-toolchain.toml') }}
      - if: steps.cargo-deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --locked check

  # `forgebase new-app` (M5.2): generates an app from the stock binary, outside the checkout, and
  # proves the generated crate works as created: its own tests pass, and its binary migrates,
  # serves, logs a user in and reports the sample DocType in the metadata API as owned by the
  # app. The generated crate depends on this checkout by path; its Cargo.lock is the checkout's.
  # The password below is for a throwaway user of the service container.
  app-template:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create and drop their own databases; the app itself uses the database `demo`.
      FORGEBASE_TEST_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/postgres
      FORGEBASE_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cargo registry and git downloads plus target/ (not the whole of ~/.cargo). The key follows the
      # toolchain and the lockfile; restore-keys gives a partial hit after a change of either.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-app-template-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-app-template-
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      # The generated crate is outside the checkout, so rust-toolchain.toml does not apply there:
      # use the same toolchain explicitly.
      - name: Use the pinned toolchain everywhere
        run: echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - run: cargo build --locked -p forgebase
      - name: Generate the app
        run: target/debug/forgebase new-app demo --forgebase-path "$GITHUB_WORKSPACE" --dir "$RUNNER_TEMP"
      - name: Test the generated app
        working-directory: ${{ runner.temp }}/demo
        run: cargo test
      - name: Build the generated app
        working-directory: ${{ runner.temp }}/demo
        run: cargo build
      - name: Migrate, serve, log in and read the metadata
        working-directory: ${{ runner.temp }}/demo
        run: |
          set -eu
          target/debug/demo migrate
          echo 'a long password' | target/debug/demo user create ann --role "Demo User"
          FORGEBASE_DEV_INSECURE_COOKIES=1 target/debug/demo serve > server.log 2>&1 &
          server=$!
          # Any answer, whatever its status, means the server is up.
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8000/api/v1/meta; then break; fi
            sleep 1
          done
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"username":"ann","password":"a long password"}' http://127.0.0.1:8000/api/v1/login
          curl -fsS -b jar http://127.0.0.1:8000/api/v1/meta/demo_note | tee meta.json
          grep -q '"app":"demo"' meta.json
          kill "$server"
      - name: Show the server log
        if: failure()
        run: cat "$RUNNER_TEMP/demo/server.log"

  # The desk (React + TypeScript, desk/). Uses the Node that ships with the runner (no extra
  # action). Also runs on the weekly schedule, so a new npm advisory is noticed. `npm audit` fails
  # the job for high and critical advisories (low and moderate are reported only).
  desk:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.desk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The npm download cache (not node_modules), keyed on the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('desk/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - name: Check the Node version
        run: node -e 'const [a, b] = process.versions.node.split(".").map(Number); if (!((a === 20 && b >= 19) || (a === 22 && b >= 12) || a > 22)) { console.error("Node ^20.19.0 or >=22.12.0 is required (Vite 8), found " + process.version); process.exit(1); }'
      # desk/.npmrc sets ignore-scripts=true: no dependency install script runs in CI.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run licenses
      - run: npm audit --audit-level=high

  # The desk smoke test (M4.2, one Playwright test in Chromium): login, list, create, edit and
  # submit a sales order, and a user without the submit right, against a real `forgebase serve`
  # with the built desk. Seeding: desk/e2e/seed.sh. Uses only the actions already used above
  # (no artifact upload: no pinned action for it is in use); on failure the server log is printed.
  # The database URL is built from the service container's credentials and never printed.
  e2e:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
          POSTGRES_DB: forgebase_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The service's own database, empty and used by this job only.
      FORGEBASE_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/forgebase_e2e
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cargo registry and git downloads plus target/ (not the whole of ~/.cargo). The key follows the
      # toolchain and the lockfile; restore-keys gives a partial hit after a change of either.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-e2e-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      # The example `e2e_app` is the stock command plus one app with a query report (M8.4): a report
      # can only come from an app compiled into the binary.
      - run: cargo build --locked -p forgebase --example e2e_app
      # The npm download cache (not node_modules), keyed on the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('desk/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - name: Check the Node version
        run: node -e 'const [a, b] = process.versions.node.split(".").map(Number); if (!((a === 20 && b >= 19) || (a === 22 && b >= 12) || a > 22)) { console.error("Node ^20.19.0 or >=22.12.0 is required (Vite 8), found " + process.version); process.exit(1); }'
      # desk/.npmrc sets ignore-scripts=true: no dependency install script runs in CI.
      - name: Build the desk
        working-directory: desk
        run: |
          npm ci
          npm run build
      # Downloads the Chromium that this exact Playwright version drives (and its system libraries).
      - name: Install Chromium
        working-directory: desk
        run: npx playwright install --with-deps chromium
      - name: Seed the database
        run: desk/e2e/seed.sh
      - name: Start the server
        run: |
          FORGEBASE_DESK_DIR=desk/dist \
          FORGEBASE_DEV_INSECURE_COOKIES=1 \
          FORGEBASE_ALLOWED_HOSTS=localhost,127.0.0.1 \
          target/debug/examples/e2e_app serve --doctypes target/e2e/doctypes > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/desk/; then exit 0; fi
            sleep 1
          done
          echo "the server did not answer in 30 seconds" >&2
          cat server.log >&2
          exit 1
      - name: Run the smoke test
        working-directory: desk
        run: npx playwright test
      - name: Show the server log
        if: failure()
        run: tail -n 100 server.log

  # The single required status check of the branch ruleset on main (owner decision of 2026-10-31,
  # docs/blueprint/maintenance-policy.md, "CI"). It runs always, also when a job failed or was
  # cancelled, and fails unless every job it needs finished with `success` or `skipped` (a skipped
  # job is how path filtering and draft pull requests leave jobs out). Any other result, including
  # one this script does not know, fails. A job added to this workflow must be added to `needs`
  # here, or the ruleset does not guard it. On a draft pull request nothing else runs, so this job
  # reports success without meaning anything; CI runs again when the pull request is marked ready.
  ci-result:
    if: always()
    needs: [changes, docs, check, sites, msrv-deny, app-template, desk, e2e, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          if not needs:
              sys.exit("no job result to check")
          bad = {name: job.get("result") for name, job in needs.items() if job.get("result") not in ("success", "skipped")}
          for name, job in sorted(needs.items()):
              print(f"{name}: {job.get('result')}")
          if bad:
              sys.exit(f"failed, cancelled or unknown: {bad}")
          PY
