name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'schedule'
    # Pinned to 24.04, not ubuntu-latest: the client tools must match the postgres:16 service, and
    # 24.04 ships postgresql-client-16 in its own archive (26.04 does not). Re-evaluate when the
    # PostgreSQL floor or the service version changes, or when 24.04 runners are retired.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The forgebase-db, forgebase-http and forgebase integration tests need PostgreSQL (they create and drop fb_test_* databases).
    # --all-features turns on the `testing` feature of the forgebase crate (its helpers are tested too).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORGEBASE_TEST_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      # The backup tests run the real pg_dump and pg_restore, whose major version must equal the
      # server's (16): a newer pg_dump writes an archive that the server's pg_restore may not read,
      # and a newer pg_restore sends SQL that an older server rejects (newer runner images
      # ship 18). postgresql-client-16 installs to /usr/lib/postgresql/16/bin next to other
      # versions (the Ubuntu 24.04 archive has it; a no-op when it is installed already).
      # FORGEBASE_PG_BIN points there for the rest of the job. The step prints the versions and
      # fails if either is not 16.
      - name: PostgreSQL 16 client tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          bin=/usr/lib/postgresql/16/bin
          for tool in pg_dump pg_restore; do
            version="$("$bin/$tool" --version)"
            echo "$version"
            case "$version" in
              "$tool (PostgreSQL) 16."*) ;;
              *) echo "$tool is not version 16" >&2; exit 1 ;;
            esac
          done
          echo "FORGEBASE_PG_BIN=$bin" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Two sites on one server and a backup restored into a new database (M7.3, ADR 0014): the
  # composed binary of examples/sales_extension with examples/sites/forgebase.toml. The script
  # examples/sites/ci.sh does the work and can be run locally. It needs the client tools
  # (pg_dump, pg_restore, version 16, the server's) like the `check` job. The URLs are built from the
  # service container's throwaway credentials; the script never prints them. The databases are
  # created by the script (`site create`).
  sites:
    if: github.event_name != 'schedule'
    # Pinned to 24.04, not ubuntu-latest: the client tools must match the postgres:16 service, and
    # 24.04 ships postgresql-client-16 in its own archive (26.04 does not). Re-evaluate when the
    # PostgreSQL floor or the service version changes, or when 24.04 runners are retired.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHOP_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/sites_shop
      FIELD_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/sites_field
      RESTORE_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/sites_restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Same step as in the `check` job (see the comment there).
      - name: PostgreSQL 16 client tools
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          bin=/usr/lib/postgresql/16/bin
          for tool in pg_dump pg_restore; do
            version="$("$bin/$tool" --version)"
            echo "$version"
            case "$version" in
              "$tool (PostgreSQL) 16."*) ;;
              *) echo "$tool is not version 16" >&2; exit 1 ;;
            esac
          done
          echo "FORGEBASE_PG_BIN=$bin" >> "$GITHUB_ENV"
      - run: cargo build --locked -p sales_extension
      - name: Two sites, a backup and a restore
        run: examples/sites/ci.sh

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97 --profile minimal
      - run: cargo +1.97 check --workspace --all-targets --all-features --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny --locked check

  # `forgebase new-app` (M5.2): generates an app from the stock binary, outside the checkout, and
  # proves the generated crate works as created: its own tests pass, and its binary migrates,
  # serves, logs a user in and reports the sample DocType in the metadata API as owned by the
  # app. The generated crate depends on this checkout by path; its Cargo.lock is the checkout's.
  # The password below is for a throwaway user of the service container.
  app-template:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create and drop their own databases; the app itself uses the database `demo`.
      FORGEBASE_TEST_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/postgres
      FORGEBASE_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      # The generated crate is outside the checkout, so rust-toolchain.toml does not apply there:
      # use the same toolchain explicitly.
      - name: Use the pinned toolchain everywhere
        run: echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - run: cargo build --locked -p forgebase
      - name: Generate the app
        run: target/debug/forgebase new-app demo --forgebase-path "$GITHUB_WORKSPACE" --dir "$RUNNER_TEMP"
      - name: Test the generated app
        working-directory: ${{ runner.temp }}/demo
        run: cargo test
      - name: Build the generated app
        working-directory: ${{ runner.temp }}/demo
        run: cargo build
      - name: Migrate, serve, log in and read the metadata
        working-directory: ${{ runner.temp }}/demo
        run: |
          set -eu
          target/debug/demo migrate
          echo 'a long password' | target/debug/demo user create ann --role "Demo User"
          FORGEBASE_DEV_INSECURE_COOKIES=1 target/debug/demo serve > server.log 2>&1 &
          server=$!
          # Any answer, whatever its status, means the server is up.
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8000/api/v1/meta; then break; fi
            sleep 1
          done
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"username":"ann","password":"a long password"}' http://127.0.0.1:8000/api/v1/login
          curl -fsS -b jar http://127.0.0.1:8000/api/v1/meta/demo_note | tee meta.json
          grep -q '"app":"demo"' meta.json
          kill "$server"
      - name: Show the server log
        if: failure()
        run: cat "$RUNNER_TEMP/demo/server.log"

  # The desk (React + TypeScript, desk/). Uses the Node that ships with the runner (no extra
  # action). Also runs on the daily schedule, so a new npm advisory is noticed. `npm audit` fails
  # the job for high and critical advisories (low and moderate are reported only).
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Node version
        run: node -e 'const [a, b] = process.versions.node.split(".").map(Number); if (!((a === 20 && b >= 19) || (a === 22 && b >= 12) || a > 22)) { console.error("Node ^20.19.0 or >=22.12.0 is required (Vite 8), found " + process.version); process.exit(1); }'
      # desk/.npmrc sets ignore-scripts=true: no dependency install script runs in CI.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run licenses
      - run: npm audit --audit-level=high

  # The desk smoke test (M4.2, one Playwright test in Chromium): login, list, create, edit and
  # submit a sales order, and a user without the submit right, against a real `forgebase serve`
  # with the built desk. Seeding: desk/e2e/seed.sh. Uses only the actions already used above
  # (no artifact upload: no pinned action for it is in use); on failure the server log is printed.
  # The database URL is built from the service container's credentials and never printed.
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgebase
          POSTGRES_PASSWORD: forgebase
          POSTGRES_DB: forgebase_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The service's own database, empty and used by this job only.
      FORGEBASE_DATABASE_URL: postgres://forgebase:forgebase@localhost:5432/forgebase_e2e
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects 1.99.1 with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo build --locked -p forgebase
      - name: Check the Node version
        run: node -e 'const [a, b] = process.versions.node.split(".").map(Number); if (!((a === 20 && b >= 19) || (a === 22 && b >= 12) || a > 22)) { console.error("Node ^20.19.0 or >=22.12.0 is required (Vite 8), found " + process.version); process.exit(1); }'
      # desk/.npmrc sets ignore-scripts=true: no dependency install script runs in CI.
      - name: Build the desk
        working-directory: desk
        run: |
          npm ci
          npm run build
      # Downloads the Chromium that this exact Playwright version drives (and its system libraries).
      - name: Install Chromium
        working-directory: desk
        run: npx playwright install --with-deps chromium
      - name: Seed the database
        run: desk/e2e/seed.sh
      - name: Start the server
        run: |
          FORGEBASE_DESK_DIR=desk/dist \
          FORGEBASE_DEV_INSECURE_COOKIES=1 \
          FORGEBASE_ALLOWED_HOSTS=localhost,127.0.0.1 \
          target/debug/forgebase serve --doctypes target/e2e/doctypes > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/desk/; then exit 0; fi
            sleep 1
          done
          echo "the server did not answer in 30 seconds" >&2
          cat server.log >&2
          exit 1
      - name: Run the smoke test
        working-directory: desk
        run: npx playwright test
      - name: Show the server log
        if: failure()
        run: tail -n 100 server.log
