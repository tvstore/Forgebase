[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/agilma/Forgebase"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
forgebase-core = { path = "crates/forgebase-core" }
forgebase-db = { path = "crates/forgebase-db" }
forgebase-http = { path = "crates/forgebase-http" }
forgebase-cli = { path = "crates/forgebase-cli" }
