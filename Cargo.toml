[workspace]
members = ["crates/*", "examples/*"]
# examples/sites is a config file and a script, not a crate.
exclude = ["examples/sites"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/tvstore/Forgebase"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
forgebase-core = { path = "crates/forgebase-core" }
forgebase-db = { path = "crates/forgebase-db" }
forgebase-http = { path = "crates/forgebase-http" }

# External dependencies: explicit minimal features. Admission notes: docs/blueprint/dependency-evaluation.md
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
thiserror = "2"
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
time = { version = "0.3", default-features = false, features = ["std"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
tokio = { version = "1", default-features = false }
uuid = { version = "1", default-features = false, features = ["std", "v7"] }
bytes = "1"
serde_json = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
getrandom = "0.4"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
