[package]
name = "forgebase-http"
description = "Forgebase HTTP API layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
forgebase-core.workspace = true
forgebase-db.workspace = true
axum.workspace = true
csv.workspace = true
# `channel` (no new crate): the body of a streamed export (M9.3).
http-body-util = { workspace = true, features = ["channel"] }
rust_decimal.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["parsing", "formatting"] }
tower.workspace = true
tokio = { workspace = true, features = ["fs", "net", "sync"] }

[dev-dependencies]
deadpool-postgres.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
