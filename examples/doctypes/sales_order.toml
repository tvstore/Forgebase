# Example DocType used by the README quick start. It has a child table, a naming series (SO-2026-00001, ...) and is submittable:
# draft -> submitted (locked, except `remarks`) -> cancelled -> amended into a new draft named SO-2026-00001-1.
# Format: docs/blueprint/architecture.md section 3 ("DocType file format").
name = "sales_order"
label = "Sales Order"
submittable = true
naming = { series = "SO-.YYYY.-.#####" }

[[fields]]
name = "customer"
type = "link"
target = "customer"
required = true

[[fields]]
name = "order_date"
type = "date"

[[fields]]
name = "items"
label = "Items"
type = "table"
target = "sales_order_item"
required = true

[[fields]]
name = "remarks"
type = "text"
# A submitted order is locked, except for the fields marked allow_on_submit.
allow_on_submit = true

# A Sales User works on orders and submits them; a Sales Manager can also delete, cancel and amend.
# (Child rows follow the parent: `sales_order_item` has no rules of its own.)
[[permissions]]
role = "Sales User"
read = true
write = true
create = true
submit = true

[[permissions]]
role = "Sales Manager"
read = true
write = true
create = true
delete = true
submit = true
cancel = true
amend = true
