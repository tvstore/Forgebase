# A DocType of the `sales` example app (examples/sales). Used by the README quick start.
# Format: docs/blueprint/architecture.md section 3 ("DocType file format").
# Labels are the humanized field names ("Full Name", "Loyalty Points", ...) unless a field sets `label`.
name = "customer"
label = "Customer"
naming = { field = "email" }
# How the desk names a customer and which columns its list shows after `name` (UX.1).
title_field = "full_name"
list_fields = ["full_name", "customer_group", "tier"]

[[fields]]
name = "email"
label = "Email"
type = "data"
max_length = 140
required = true
unique = true

[[fields]]
name = "full_name"
type = "data"
required = true

[[fields]]
name = "notes"
type = "text"

[[fields]]
name = "loyalty_points"
type = "int"

[[fields]]
name = "credit_limit"
type = "decimal"
precision = 12
scale = 2

[[fields]]
name = "active"
type = "check"

[[fields]]
name = "joined_on"
type = "date"

[[fields]]
name = "last_seen_at"
type = "datetime"

[[fields]]
name = "tier"
type = "select"
options = ["standard", "silver", "gold"]

[[fields]]
name = "customer_group"
type = "link"
target = "customer_group"

# Who may do what (ADR 0011). The `forgebase doc` commands run as the trusted system context and ignore these rules;
# they apply to real users (HTTP API, M3.3). A DocType without rules is closed to everyone except `Administrator`.
[[permissions]]
role = "Sales User"
read = true

[[permissions]]
role = "Sales Manager"
read = true
write = true
create = true
delete = true
